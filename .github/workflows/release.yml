# Builds the app for both kinds of Mac and attaches them to a release.
#
# There is no Developer ID here, so the apps are ad-hoc signed: macOS will ask
# the person who downloads one to allow it the first time. Notarising instead
# would need a paid Apple developer account.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14           # Apple silicon
            arch: arm64
          - runner: macos-15-intel     # Intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    # A label GitHub has retired queues for ever rather than failing, which is
    # how the Intel half of the first release sat waiting for a runner that no
    # longer exists. Check the label against GitHub's current list before
    # changing it.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install OpenSSL
        run: brew install openssl@3

      - name: Build and test
        run: make test

      - name: Build the app
        run: make app

      - name: Check it carries its own OpenSSL
        # A bundle still pointing at Homebrew would not start on a machine
        # that has never had it, which is every machine this is built for.
        run: |
          binary=".build/Anko Inkless A4.app/Contents/MacOS/Anko Inkless A4"
          if otool -L "$binary" | grep -q "/opt/homebrew\|/usr/local/opt"; then
            echo "the app still depends on Homebrew:"
            otool -L "$binary" | grep "/opt/homebrew\|/usr/local/opt"
            exit 1
          fi

      - name: Zip it
        run: |
          cd .build
          ditto -c -k --sequesterRsrc --keepParent \
            "Anko Inkless A4.app" "Anko-Inkless-A4-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Anko-Inkless-A4-${{ matrix.arch }}
          path: .build/Anko-Inkless-A4-${{ matrix.arch }}.zip

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Both architectures build at once, so whichever arrives first
          # creates the release and the other joins it. The notes are what
          # someone who has never seen this project reads first, so they say
          # which file to take and what macOS is about to do.
          notes=$(cat <<'NOTES'
### Which file?

Click  → **About This Mac**:

| It says | Download |
|---|---|
| Apple M1, M2, M3, M4… | `Anko-Inkless-A4-arm64.zip` |
| Intel | `Anko-Inkless-A4-x86_64.zip` |

### Installing

Unzip it, drag **Anko Inkless A4** to your Applications folder, and open it.

**macOS will refuse it the first time**, saying it cannot verify the developer.
That is expected — being verified costs an annual fee to Apple and this is a
free project. To let it through, go to  → **System Settings** →
**Privacy & Security**, scroll to **Security**, and click **Open Anyway**. That
button only appears *after* macOS has refused the app once.

The app has no window: it lives in the menu bar. Switch the printer on, then
print to **Anko Inkless A4** from any app and allow Bluetooth when asked.

Full instructions and troubleshooting are in the
[README](https://github.com/hmvs/mv-b530-macos-cups-driver#install).
NOTES
)
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" \
                 --title "${GITHUB_REF_NAME}" --notes "$notes" \
            || true
          gh release upload "${GITHUB_REF_NAME}" \
            ".build/Anko-Inkless-A4-${{ matrix.arch }}.zip" --clobber
